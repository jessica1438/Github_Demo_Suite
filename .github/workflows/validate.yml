name: Validate Data

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CSV
        run: |
          echo "Validating data.csv..."
          rows=$(tail -n +2 data.csv | wc -l)
          echo "Found $rows rows"
          if [ "$rows" -lt 1 ]; then
            echo "ERROR: No data rows found"
            exit 1
          fi
          echo "Validation passed"
